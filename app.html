<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा DevOps सफ़र</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            border: 1px solid #334155;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .highlight {
            color: #4ade80;
            font-weight: bold;
        }
        .badge {
            background-color: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🚀</div>
        <div class="badge">संकल्प / Resolution</div>
        <h1>मेरा DevOps सफ़र शुरू!</h1>
        <p>
            आज से मैंने अपना <span class="highlight">DevOps Course</span> शुरू कर दिया है। 
            मैं पूरी मेहनत और लगन के साथ इस कोर्स को <span class="highlight">शुरुआत से अंत तक</span> अच्छे से खत्म करूँगा!
        </p>
    </div>

</body>
</html>
